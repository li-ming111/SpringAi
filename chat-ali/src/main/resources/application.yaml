        repository:
          jdbc:
            mysql:
              jdbc-url: jdbc:mysql://localhost:3306/spring_ai?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
              username: root
              password: root
              driver-class-name: com.mysql.cj.jdbc.Driver
              enabled: true