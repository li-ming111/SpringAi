spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3-30b-a3b
    memory:
      redis:
        host: localhost
        port: 6379
        database: 0
        timeout: 10000
    chat:
